# The root orchestrator is safe to load: it initializes missing starter files, then stops at privacyReady=false.
# The separate settings companion remains active so the user can configure the dormant suite in DSH Settings.
- insert:
    - id: hers-life
      name: dsh-hers-life
      config:
        security:
          privacyReady: false
        workspacePath: ''
        environment:
          pythonPath: ''
          ffmpegPath: ''
          ffplayPath: ''
          adbPath: ''
          dshToolsPath: ''
        coreMemory: {}
        memory:
          root: ''
          personaFiles:
            - persona/人設.md
            - persona/名字.md
            - persona/約定.md
          diaryDir: diary
          diaryCount: 3
          maxChars: 12000
        graph:
          syncSeconds: 120
          qqObservations: ''
          skillsCwd: ''
          skillsOffFile: ''
        discord:
          enabled: false
          ownerUserId: ''
          directMessages: true
          mentionRequired: true
          observeUnmentioned: false
          allowedGuildIds: []
          allowedChannelIds: []
          allowedUserIds: []
          ownerUserIds: []
        qq:
          ownerQQ: ''
          inboxPath: ''
          chatSessionsPath: ''
        interest:
          enabled: false
          observeEnabled: false
          observePrivate: false
          groups: []
          observeGroups: []
        bilibiliAccount: {}
        browse:
          enabled: false
          serial: ''
          adbPath: ''
        voice:
          root: ''
          voice: zh-CN-XiaoxiaoNeural
          rate: '+0%'
        wake: {}
        resume:
          adbPath: ''
          serial: ''
        skillIsolate: {}
        mousepet:
          cursorMode: companion
          cursorHoldMs: 2600
          cursorSize: 64
          companion:
            enabled: false
            tickMs: 0
- insert:
    - id: hers-life-settings
      name: dsh-hers-life-settings
