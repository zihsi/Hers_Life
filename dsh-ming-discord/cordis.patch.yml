- insert:
    - id: ming-discord
      name: dsh-ming-discord
      config:
        enabled: true
        # Token 從 Windows 環境變數 DISCORD_BOT_TOKEN 讀取，勿寫進倉庫。
        # 留空时使用 MING_WORKSPACE；未设置时回退到 <DSH_HOME>/workspace。
        workspacePath: ''
        mentionRequired: true
        directMessages: true
        # 未 @ 的群訊息仍會寫入共享 inbox，供興趣插件被動觀察；關閉只保留直接回覆的訊息。
        observeUnmentioned: true
        # 空陣列代表不額外限制；建議正式使用時填入允許的 Guild / Channel ID。
        allowedGuildIds: []
        allowedChannelIds: []
        # 若設定 MING_OWNER_DISCORD_ID，主人會自動加入允許名單。
        allowedUserIds: []
        ownerUserIds: []
        newMessagePolicy: steer
        provider: ''
        model: ''
        agentPreset: ''
        maxAttachmentBytes: 10485760
        # 使用相容 OneBot 格式的 inbox，讓 ming-interest 可以讀取未 @ Bot 的群訊息。
        inboxPath: ''
        chatSessionsPath: ''
